# RetroArch global settings copied from the old RetroPie card (Nov 25 2026).
# Applied over the fresh card's /opt/retropie/configs/all/retroarch.cfg by retropie-setup.sh.
# audio_driver is set by the script; audio_device is NOT here (it holds a Bluetooth address).
core_options_path = "/opt/retropie/configs/all/retroarch-core-options.cfg"
rgui_show_start_screen = "false"
config_save_on_exit = "false"
input_joypad_driver = "udev"
menu_driver = "rgui"
video_aspect_ratio_auto = "true"
video_aspect_ratio = "22"
video_vsync = true
video_threaded = "true"
video_smooth = false
video_scale_integer = true
video_shader_enable = "true"
video_font_size = "24"
input_autodetect_enable = "true"
input_player1_a = "x"
input_player1_b = "z"
input_player1_y = "a"
input_player1_x = "s"
input_player1_start = "enter"
input_player1_select = "rshift"
input_player1_l = "q"
input_player1_r = "w"
input_player1_left = "left"
input_player1_right = "right"
input_player1_up = "up"
input_player1_down = "down"
menu_swap_ok_cancel_buttons = "false"
input_exit_emulator = "escape"
input_shader_next = "m"
input_shader_prev = "n"
input_rewind = "r"
all_users_control_menu = "true"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_unified_controls = "true"
system_directory = "/home/pi/RetroPie/BIOS"
rgui_browser_directory = "/home/pi/RetroPie/roms"
cache_directory = "/tmp/retroarch"
rewind_enable = "false"
rewind_buffer_size = "10"
rewind_granularity = "2"
video_gpu_screenshot = "true"
rgui_switch_icons = "false"
global_core_options = "true"
input_enable_hotkey = "nul"
auto_remaps_enable = "true"
rgui_aspect_ratio_lock = "2"
menu_show_restart_retroarch = "false"
xmb_show_add = "false"
xmb_show_history = "false"
xmb_show_images = "false"
xmb_show_music = "false"
xmb_shadows_enable = "false"
quit_press_twice = "false"
